# Home Assistant's own Alpine bases. Pinned: a base image moving underneath a
# customer's house is not something to discover from a support call.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
